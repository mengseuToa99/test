<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambodia Admin Data Test</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #eef2f3; padding: 40px 20px; display: flex; justify-content: center; }
        .card { background: white; width: 100%; max-width: 500px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden; }
        
        /* Status Banner Styles */
        #status-banner { padding: 15px; text-align: center; font-weight: bold; font-size: 0.9rem; transition: 0.3s; }
        .loading { background: #d1ecf1; color: #0c5460; }
        .success { background: #d4edda; color: #155724; border-bottom: 2px solid #c3e6cb; }
        .fallback { background: #fff3cd; color: #856404; border-bottom: 2px solid #ffeeba; }
        .error { background: #f8d7da; color: #721c24; }

        .content { padding: 25px; }
        .group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; font-size: 0.85rem; text-transform: uppercase; }
        
        select { width: 100%; padding: 12px; border: 2px solid #dee2e6; border-radius: 8px; font-size: 1rem; color: #495057; outline: none; transition: border-color 0.2s; }
        select:focus { border-color: #007bff; }
        select:disabled { background-color: #e9ecef; cursor: not-allowed; }

        .village-result { background: #f8f9fa; border-radius: 8px; padding: 15px; border: 1px solid #dee2e6; }
        #village-list { padding-left: 20px; margin: 0; max-height: 150px; overflow-y: auto; color: #555; }
        .no-data { list-style: none; padding: 0; color: #999; font-style: italic; }
    </style>
</head>
<body>

<div class="card">
    <div id="status-banner" class="loading">
        ⏳ ATTEMPTING TO CONNECT TO MEF API...
    </div>

    <div class="content">
        <div class="group">
            <label>1. Select Province (City)</label>
            <select id="province" disabled><option>Loading data...</option></select>
        </div>

        <div class="group">
            <label>2. Select District (State)</label>
            <select id="district" disabled><option>-- Select Province First --</option></select>
        </div>

        <div class="group">
            <label>3. Select Commune (Commute)</label>
            <select id="commune" disabled><option>-- Select District First --</option></select>
        </div>

        <div class="village-result">
            <label>Villages Found:</label>
            <ul id="village-list">
                <li class="no-data">No commune selected</li>
            </ul>
        </div>
    </div>
</div>

<script>
    // --- API Configuration ---
    const targetUrl = "https://data.mef.gov.kh/api/v1/public-datasets/pd_68e370856a965e00074a5e7b/json?page=1&page_size=1000";
    // Using a proxy to bypass CORS security blocks
    const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;

    const banner = document.getElementById('status-banner');
    const pSel = document.getElementById('province');
    const dSel = document.getElementById('district');
    const cSel = document.getElementById('commune');
    const vList = document.getElementById('village-list');

    let mainData = [];

    // --- Mock Data (Fallback) ---
    const fallbackData = [
        { province_en: "Phnom Penh", district_en: "Chamkar Mon", commune_en: "Tonle Bassac", village_en: "Phum 1" },
        { province_en: "Phnom Penh", district_en: "Chamkar Mon", commune_en: "Tonle Bassac", village_en: "Phum 2" },
        { province_en: "Siem Reap", district_en: "Siem Reap City", commune_en: "Sala Kamraeuk", village_en: "Wat Bo" },
        { province_en: "Battambang", district_en: "Battambang City", commune_en: "Svay Pao", village_en: "Phum Preak Moha Tep" }
    ];

    async function startApp() {
        try {
            const res = await fetch(proxyUrl);
            if (!res.ok) throw new Error("Connection failed");
            
            const wrapper = await res.json();
            const json = JSON.parse(wrapper.contents);
            mainData = json.data || [];

            if (mainData.length === 0) throw new Error("Empty API data");

            // Success State
            banner.innerText = "✅ CONNECTED TO LIVE MEF DATA";
            banner.className = "success";
        } catch (err) {
            console.warn("API Blocked. Loading Fallback UI.", err);
            
            // Fallback State
            mainData = fallbackData;
            banner.innerHTML = "⚠️ API BLOCKED (CORS ERROR)<br><small>Showing Fallback Mock Data for Testing</small>";
            banner.className = "fallback";
        }
        
        setupDropdowns();
    }

    function setupDropdowns() {
        pSel.innerHTML = '<option value="">-- Choose Province --</option>';
        const provinces = [...new Set(mainData.map(i => i.province_en))].sort();
        provinces.forEach(p => pSel.add(new Option(p, p)));
        pSel.disabled = false;
    }

    pSel.onchange = () => {
        dSel.innerHTML = '<option value="">-- Choose District --</option>';
        cSel.innerHTML = '<option value="">-- Choose Commune --</option>';
        dSel.disabled = !pSel.value;
        cSel.disabled = true;
        vList.innerHTML = '<li class="no-data">Select a commune</li>';

        if(pSel.value) {
            const districts = [...new Set(mainData.filter(i => i.province_en === pSel.value).map(i => i.district_en))].sort();
            districts.forEach(d => dSel.add(new Option(d, d)));
        }
    };

    dSel.onchange = () => {
        cSel.innerHTML = '<option value="">-- Choose Commune --</option>';
        cSel.disabled = !dSel.value;
        vList.innerHTML = '<li class="no-data">Select a commune</li>';

        if(dSel.value) {
            const communes = [...new Set(mainData.filter(i => i.province_en === pSel.value && i.district_en === dSel.value).map(i => i.commune_en))].sort();
            communes.forEach(c => cSel.add(new Option(c, c)));
        }
    };

    cSel.onchange = () => {
        vList.innerHTML = '';
        if(cSel.value) {
            const villages = mainData.filter(i => 
                i.province_en === pSel.value && i.district_en === dSel.value && i.commune_en === cSel.value
            ).map(i => i.village_en).sort();

            villages.forEach(v => {
                const li = document.createElement('li');
                li.innerText = v || "Unknown Village";
                vList.appendChild(li);
            });
        } else {
            vList.innerHTML = '<li class="no-data">Select a commune</li>';
        }
    };

    startApp();
</script>

</body>
</html>
